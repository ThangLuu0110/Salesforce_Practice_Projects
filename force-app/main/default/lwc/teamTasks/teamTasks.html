<!-- Team Tasks Custom Fields:
 - Name - input
 - Priority - Picklist
 - Assigned To - Record Picker
 - Deadline - Date
 - Estimated Hours - Number
-->
<template>
    <div class="teamTasks">
        <header class="teamTasks_header">
            <form class="teamTasks_header-create">
                <div class="teamTasks_header-create-form">
                    <lightning-input 
                    type="text" 
                    label="Task Name" 
                    placeholder="Enter Task Name"
                    ></lightning-input>
                    <lightning-select
                        name="Priority"
                        label="Priority"
                        value={valuePriority}
                        options={optionsPriority}
                        onchange={handleChangePriority}
                        required
                    ></lightning-select>
                    <lightning-record-picker
                        label="Assigned To"
                        placeholder="Search Members..."
                        object-api-name="Team_Members__c"
                    ></lightning-record-picker>
                    <lightning-input 
                        type="date" 
                        label="Due Date" 
                        placeholder="Enter Due Date"
                    ></lightning-input>
                    <lightning-input 
                        type="number" 
                        label="Estimated Hours" 
                        placeholder="Enter Estimated Hours"
                    ></lightning-input>
                </div>
                <div class="teamTasks_header-create-button">
                    <lightning-button 
                        label="Create Task" 
                        variant="brand" 
                        onclick={handleCreateTask}
                    ></lightning-button>
                </div>
            </form>
        </header>
        <section class="teamTasks_task-table">

        </section>
    </div>
</template>
